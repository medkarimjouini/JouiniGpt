name: Check JouiniGPT API
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/api-check.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/api-check.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install
      - run: npm run check
